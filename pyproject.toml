[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "isaac-rl"
version = "0.1.0"

description = "Reinforcement learning environment for The Binding of Isaac: Afterbirth+"

requires-python = ">=3.10"

dependencies = [
    "gymnasium>=1.3,<1.4",
    "numpy>=2,<3",
]


[project.optional-dependencies]
train = [
    "stable-baselines3>=2.9,<3",
    "tensorboard>=2.20,<3"
]

dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]


[tool.setuptools.packages.find]
where = ["src"]